<section>
    @if (photoUrls.length > 0) {
    <div class="gallery-header">
        <h2>{{galleryName}}</h2>
    </div>
    <div class="divider"></div>
    <p class="gallery-description">{{galleryDescription}}</p>
    <div class="divider"></div>
    <div class="gallery">
        <img *ngFor="let img of photoUrls" [src]="img" loading="lazy" />
    </div>
    }@else {
        <mat-spinner></mat-spinner>
    }

</section>
